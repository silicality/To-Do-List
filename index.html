<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#062e3f">
    <meta name="Description" content="A dynamic and aesthetic To-Do List WebApp.">

    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />

    <link rel="shortcut icon" type="image/png" href="assets/favicon.png" />
    <link rel="stylesheet" href="CSS/main.css">
    <title>JUST DO IT</title>
</head>

<body class="standard">
    <!-- Toast Notification System -->
    <div id="toast-container"></div>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-top">
                <div class="title-container">
                    <h1 id="title">Just do it.<div id="border"></div>
                    </h1>
                    <p class="subtitle"><span id="datetime"></span></p>
                </div>
                <div class="theme-switcher">
                    <div class="standard-theme theme-selector" title="Standard Theme"></div>
                    <div class="light-theme theme-selector" title="Light Theme"></div>
                    <div class="darker-theme theme-selector" title="Dark Theme"></div>
                </div>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="app-main">
            <!-- Top Controls: Search & Filter -->
            <section class="controls-section glass-card">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-input" placeholder="Search tasks...">
                </div>
                <div class="filter-box">
                    <i class="fas fa-filter"></i>
                    <select id="filter-todo" class="filter-select">
                        <option value="all">All Tasks</option>
                        <option value="completed">Completed</option>
                        <option value="uncompleted">Pending</option>
                    </select>
                </div>
            </section>

            <!-- Task Input Form -->
            <section class="form-section glass-card">
                <form id="todo-form">
                    <div class="input-group main-input">
                        <div class="input-tooltip" id="task-tooltip">Add your task here! ✍️</div>
                        <input class="todo-input" type="text" placeholder="What needs to be done?">
                    </div>
                    <div class="input-group extra-inputs">
                        <div class="select-wrapper">
                            <i class="fas fa-folder"></i>
                            <select class="todo-category" required>
                                <option value="" disabled selected hidden>Category</option>
                                <option value="Personal">Personal</option>
                                <option value="Work">Work</option>
                                <option value="Study">Study</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="select-wrapper">
                            <select class="todo-priority" required>
                                <option value="" disabled selected hidden>Priority</option>
                                <option value="Low">Low</option>
                                <option value="Medium">Medium</option>
                                <option value="High">High</option>
                            </select>
                        </div>
                        <div class="select-wrapper">
                            <input class="todo-due-date" type="date" title="Due Date">
                        </div>
                        <div class="select-wrapper">
                            <input class="todo-due-time" type="time" title="Due Time">
                        </div>
                        <button class="todo-btn" type="submit">
                            <i class="fas fa-plus"></i> Add
                        </button>
                    </div>
                </form>
            </section>

            <!-- Task List -->
            <section class="list-section" id="list-section">
                <!-- Empty State -->
                <div class="empty-state" id="empty-state">
                    <i class="fas fa-clipboard-check empty-icon"></i>
                    <p>No tasks found. Time to relax or add a new one!</p>
                </div>

                <div class="task-category-section" id="pending-section">
                    <h3 class="section-title"><i class="fas fa-hourglass-half"></i> Pending Tasks</h3>
                    <ul class="todo-list" id="pending-list"></ul>
                </div>

                <div class="task-category-section" id="expired-section">
                    <h3 class="section-title"><i class="fas fa-exclamation-circle"></i> Expired Tasks</h3>
                    <ul class="todo-list" id="expired-list"></ul>
                </div>

                <div class="task-category-section" id="completed-section">
                    <h3 class="section-title"><i class="fas fa-check-double"></i> Completed Tasks</h3>
                    <ul class="todo-list" id="completed-list"></ul>
                </div>
            </section>
        </main>
    </div>

    <!-- Github Corner -->
    <div class="version">
        <div class="demo version-section"><a href="https://github.com/silicality/To-Do-List" class="github-corner">
                <svg width="60" height="60" viewBox="0 0 250 250"
                    style="fill:rgba(0,0,0,0.6); color:#fff; position: absolute; bottom: 0; border: 0; left: 0; transform: scale(-1, -1); opacity: 0.8;">
                    <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
                    <path
                        d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2"
                        fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"></path>
                    <path
                        d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z"
                        fill="currentColor" class="octo-body"></path>
                </svg></a>
        </div>
    </div>

    <script src="JS/time.js"></script>
    <script src="JS/main.js"></script>
</body>

</html>
